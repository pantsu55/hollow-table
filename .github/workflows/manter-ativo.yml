# Mantém o projeto do Supabase (plano grátis) ativo: faz uma consulta leve a cada 3 dias.
# Usa só a chave pública (publishable), a mesma que já está no app.
name: Manter o Supabase ativo
on:
  schedule:
    - cron: '17 12 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar o banco
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H "apikey: sb_publishable_zg_rPvJ15I_wbaFZ2qemeg_Xnsalgsh" \
            -H "Content-Type: application/json" -d '{}' \
            "https://ksucnjrmcagzepxahync.supabase.co/rest/v1/rpc/ping")
          echo "Resposta do Supabase: $code"
          test "$code" = "200"
